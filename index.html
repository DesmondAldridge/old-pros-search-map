<!doctype html>
<html>

<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="maplibre-gl.css">
	<script src="maplibre-gl.js"></script>
	<style>
		html,
		body {
			height: 100%;
			margin: 0;
			overflow: hidden;
			font-family: system-ui, sans-serif;
		}

		#map {
			position: absolute;
			inset: 0;
		}

		.map-search {
			position: absolute;
			top: 10px;
			left: 10px;
			z-index: 2;
			width: min(280px, calc(100% - 70px));
		}

		.map-search input {
			width: 100%;
			box-sizing: border-box;
			padding: 9px 12px;
			font-size: 14px;
			border: 1px solid #ccc;
			border-radius: 6px;
			box-shadow: 0 1px 4px rgba(0, 0, 0, .15);
		}

		.map-search ul {
			list-style: none;
			margin: 4px 0 0;
			padding: 0;
			background: #fff;
			border-radius: 6px;
			box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
			max-height: 260px;
			overflow-y: auto;
		}

		.map-search ul:empty {
			display: none;
		}

		.map-search li {
			padding: 8px 12px;
			cursor: pointer;
			font-size: 14px;
		}

		.map-search li span {
			display: block;
			font-size: 12px;
			color: #777;
		}

		.map-search li:hover,
		.map-search li.active {
			background: #f0f0f0;
		}

		/* .maplibregl-popup-content p {
			margin: 4px 0 0;
			font-size: 13px;
		} */
	</style>
</head>

<body>
	<div id="map"></div>
	<div class="map-search">
		<input id="search-input" type="search" autocomplete="off" aria-label="Search locations">
		<ul id="search-results" role="listbox"></ul>
	</div>
</body>

</html>
