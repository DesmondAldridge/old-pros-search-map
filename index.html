<!doctype html>
<html>

<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="maplibre-gl.css">
	<script src="maplibre-gl.js"></script>
	<style>
		html,
		body {
			height: 100%;
			margin: 0;
			overflow: hidden;
			font-family: system-ui, sans-serif;
		}

		#map {
			position: absolute;
			inset: 0;
		}

		.map-search {
			position: absolute;
			top: 10px;
			left: 10px;
			z-index: 2;
			width: min(280px, calc(100% - 70px));
		}

		.map-search input {
			width: 100%;
			box-sizing: border-box;
			padding: 9px 12px;
			font-size: 14px;
			border: 1px solid #ccc;
			border-radius: 6px;
			box-shadow: 0 1px 4px rgba(0, 0, 0, .15);
		}

		.map-search ul {
			list-style: none;
			margin: 4px 0 0;
			padding: 0;
			background: #fff;
			border-radius: 6px;
			box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
			max-height: 260px;
			overflow-y: auto;
		}

		.map-search ul:empty {
			display: none;
		}

		.map-search li {
			padding: 8px 12px;
			cursor: pointer;
			font-size: 14px;
		}

		.map-search li span {
			display: block;
			font-size: 12px;
			color: #777;
		}

		.map-search li:hover,
		.map-search li.active {
			background: #f0f0f0;
		}

		/* .maplibregl-popup-content p {
			margin: 4px 0 0;
			font-size: 13px;
		} */

		.annotation {
			width: 0;
			height: 0;
			pointer-events: none;
		}

		.annotation-connector {
			position: absolute;
			left: 0;
			top: 0;
			width: 1px;
			height: 1px;
			overflow: visible;
		}

		.annotation-dot {
			position: absolute;
			width: 6px;
			height: 6px;
			margin: -3px 0 0 -3px;
			border-radius: 50%;
		}

		.annotation-label {
			position: absolute;
			transform: translate(-50%, -50%);
			width: max-content;
			text-align: center;
			line-height: 1.3;
			white-space: pre-line;
		}

		.map-legend {
			position: absolute;
			z-index: 2;
			max-width: calc(100% - 20px);
			box-sizing: border-box;
			background: rgba(255, 255, 255, .9);
			border-radius: 6px;
			padding: 6px 10px;
			box-shadow: 0 1px 4px rgba(0, 0, 0, .15);
		}

		.map-legend.pos-bottom-left {
			bottom: 30px;
			left: 10px;
		}

		.map-legend.pos-bottom-right {
			bottom: 30px;
			right: 10px;
		}

		.map-legend.pos-top-left {
			top: 56px;
			left: 10px;
		}

		.map-legend.pos-top-right {
			top: 10px;
			right: 50px;
		}

		.map-legend.filterable {
			cursor: pointer;
		}
	</style>
</head>

<body>
	<div id="map"></div>
	<div class="map-search">
		<input id="search-input" type="search" autocomplete="off" aria-label="Search locations">
		<ul id="search-results" role="listbox"></ul>
	</div>
	<div id="legend" class="map-legend pos-bottom-left"></div>
</body>

</html>
