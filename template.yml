id: old-pros-search-map
version: 1.0.6
name: Old Pros Search Map
description: Zoomable point map with search, category colors and popups
author: Noontide Studios
credits: "Base map © [OpenFreeMap](https://openfreemap.org) © [OpenStreetMap](https://www.openstreetmap.org/copyright) contributors"

sdk_version: 3

build:
  src:
    script: npm run build
    directory: src
    files:
      - rollup.config.js

  less:
    script: npm run less
    directory: less

settings:
  # - Map
  # - property: map_style
  #   name: Base map style URL
  #   type: string
  # - property: start_lat
  #   name: Start latitude
  #   type: number
  #   width: quarter
  # - property: start_lon
  #   name: Start longitude
  #   type: number
  #   width: quarter
  # - property: start_zoom
  #   name: Start zoom
  #   type: number
  #   min: 0
  #   max: 18
  #   step: 0.5
  #   width: quarter
  - Map
  - property: map_style
    name: Base map
    type: string
    choices_other: true
    choices:
      - [Liberty (detailed streets), "https://tiles.openfreemap.org/styles/liberty"]
      - [Bright, "https://tiles.openfreemap.org/styles/bright"]
      - [Positron (light, minimal), "https://tiles.openfreemap.org/styles/positron"]
      - [Dark, "https://tiles.openfreemap.org/styles/dark"]
      - [Fiord (dark blue), "https://tiles.openfreemap.org/styles/fiord"]

  - property: base_hide_labels
    name: Hide map labels
    type: boolean
  - property: base_land_color
    name: Land
    type: color
    optional: true
    width: half
    new_section: Base map colors (leave blank for style default)
  - property: base_water_color
    name: Water
    type: color
    optional: true
    width: half
  - property: base_road_color
    name: Roads
    type: color
    optional: true
    width: half
  - property: base_border_color
    name: Borders
    type: color
    optional: true
    width: half
  - property: base_label_color
    name: Label text
    type: color
    optional: true
    width: half
    hide_if: base_hide_labels
  - property: base_label_halo
    name: Label outline
    type: color
    optional: true
    width: half
    hide_if: base_hide_labels
  - property: base_label_opacity
    name: Label opacity
    type: number
    min: 0
    max: 1
    step: 0.1
    width: half
    hide_if: base_hide_labels
  - property: base_label_halo_opacity
    name: Outline opacity
    description: Applies when a Label outline color is set
    type: number
    min: 0
    max: 1
    step: 0.1
    width: half
    hide_if: base_hide_labels

  - Points
  - property: point_radius
    name: Point radius
    type: number
    min: 2
    max: 20
  - property: category_colors
    name: Category palette
    type: colors
  - property: color_overrides
    name: Color overrides
    description: "One per line, e.g. Historic Landmark: #990F4B"
    type: text
      - property: point_opacity
    name: Point opacity
    type: number
    min: 0
    max: 1
    step: 0.1
  - property: point_scale_with_zoom
    name: Scale with zoom
    type: boolean
  - property: point_scale_factor
    name: Size when zoomed in
    description: Multiple of the point radius at street level (zoom 14+)
    type: number
    min: 1
    max: 6
    step: 0.5
    show_if: point_scale_with_zoom
  - property: point_min_zoom
    name: Show from zoom
    type: number
    min: 0
    max: 24
    step: 0.5
    width: half
    new_section: Zoom visibility
  - property: point_max_zoom
    name: Hide from zoom
    type: number
    min: 0
    max: 24
    step: 0.5
    width: half

  - Search
  - property: search_placeholder
    name: Placeholder text
    type: string
  - property: search_zoom
    name: Zoom level when a result is picked
    type: number
    min: 1
    max: 18

  - Popups & panels
  - property: popup
    import: "@flourish/info-popup"
  
  - Annotations
  - property: annotations_show
    name: Show annotations
    type: boolean
  - property: annotation_devices
    name: Show on
    type: string
    style: buttons
    choices:
      - [All, all]
      - [Desktop, desktop]
      - [Mobile, mobile]
    show_if: annotations_show
  - property: annotation_min_zoom
    name: Hide when zoomed out past
    description: Annotations are hidden below this zoom level (0 = always visible)
    type: number
    min: 0
    max: 18
    step: 0.5
    show_if: annotations_show
  - property: annotation_text_size
    name: Text size
    type: number
    min: 8
    max: 40
    width: half
    show_if: annotations_show
  - property: annotation_font_weight
    name: Weight
    type: string
    style: buttons
    width: half
    choices:
      - [Normal, "400"]
      - [Bold, "700"]
    show_if: annotations_show
  - property: annotation_text_color
    name: Text color
    type: color
    width: half
    show_if: annotations_show
  - property: annotation_bg_color
    name: Background
    type: color
    width: half
    show_if: annotations_show
  - property: annotation_bg_opacity
    name: Background opacity
    type: number
    min: 0
    max: 1
    step: 0.1
    width: half
    show_if: annotations_show
  - property: annotation_max_width
    name: Max width (px)
    type: number
    min: 60
    max: 500
    width: half
    show_if: annotations_show
  - property: annotation_padding
    name: Padding
    type: number
    min: 0
    max: 30
    width: half
    show_if: annotations_show
  - property: annotation_radius
    name: Corner radius
    type: number
    min: 0
    max: 30
    width: half
    show_if: annotations_show
  - property: annotation_offset_x
    name: Default offset X
    description: Used when a row has no Offset X
    type: number
    width: half
    new_section: true
    show_if: annotations_show
  - property: annotation_offset_y
    name: Default offset Y
    description: Used when a row has no Offset Y (negative = above the point)
    type: number
    width: half
    show_if: annotations_show
  - property: annotation_connector
    name: Connector line
    type: boolean
    new_section: true
    show_if: annotations_show
  - property: annotation_connector_color
    name: Line color
    type: color
    width: half
    show_if:
      annotations_show: true
      annotation_connector: true
  - property: annotation_connector_width
    name: Line width
    type: number
    min: 0.5
    max: 6
    step: 0.5
    width: half
    show_if:
      annotations_show: true
      annotation_connector: true
  - property: annotation_dot
    name: Dot at the point
    type: boolean
    show_if: annotations_show

data:
  - Locations
  - name: Name
    dataset: points
    key: name
    type: column
    column: Points::A
  - name: Category
    dataset: points
    key: category
    type: column
    column: Points::B
  - name: Latitude
    dataset: points
    key: lat
    type: column
    column: Points::C
    data_type: [number, string]
  - name: Longitude
    dataset: points
    key: lon
    type: column
    column: Points::D
    data_type: [number, string]
  - name: Popup info
    description: Any columns to show in the popup
    dataset: points
    key: info
    type: columns
    columns: Points::E

  - Annotations
  - name: Label
    dataset: annotations
    key: label
    type: column
    column: Annotations::A
  - name: Latitude
    dataset: annotations
    key: lat
    type: column
    column: Annotations::B
    data_type: [number, string]
  - name: Longitude
    dataset: annotations
    key: lon
    type: column
    column: Annotations::C
    data_type: [number, string]
  - name: Offset X (px)
    dataset: annotations
    key: offset_x
    type: column
    column: Annotations::D
    optional: true
    data_type: [number, string]
  - name: Offset Y (px)
    dataset: annotations
    key: offset_y
    type: column
    column: Annotations::E
    optional: true
    data_type: [number, string]